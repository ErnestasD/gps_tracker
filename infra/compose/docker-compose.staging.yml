# Staging infra overrides: TLS via Caddy, GlitchTip on, services bound to localhost where
# Caddy fronts them. NOTE: the real staging APP deploy layers docker-compose.apps.yml on the
# base (see docs/runbooks/staging-app-deploy.md); this overlay only adds GlitchTip + the 80/443
# port publish + the localhost bindings, and can be combined with apps.yml.
# Usage: docker compose -f docker-compose.yml -f docker-compose.apps.yml -f docker-compose.staging.yml up -d
# `ports: []` DOES NOT UNPUBLISH ANYTHING. Compose MERGES port lists across files — an override can
# only add. The entries that used to sit here for `pg` and `redis` were silent no-ops that read like
# protection, which is worse than nothing: the actual guarantee is in the BASE file, where both bind
# `127.0.0.1` (see its SECURITY header — Docker publishes by inserting iptables rules that bypass
# UFW, so a `5432:5432` there would be public whatever this file said). Verified on staging:
# `orbetra-pg-1 :: 127.0.0.1:5432->5432/tcp`.
services:

  glitchtip:
    image: glitchtip/glitchtip:latest
    environment:
      DATABASE_URL: postgresql://postgres:${PG_PASSWORD}@pg:5432/glitchtip
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    # NO `ports` here. The base publishes `${CADDY_HTTP_PORT:-8088}:80` / `${CADDY_HTTPS_PORT:-8449}:443`,
    # and because compose MERGES the lists, re-stating 80/443 published Caddy on FOUR host ports —
    # the documented three-file invocation quietly exposed 8088/8449 alongside the real ones. Set
    # `CADDY_HTTP_PORT=80` and `CADDY_HTTPS_PORT=443` in the server's .env instead, which is what the
    # live staging host already does.
    volumes:
      # base compose already mounts ../Caddyfile; re-stated here so the staging TLS/site blocks
      # (ORBETRA_STAGING_HOST http:// + on-demand https://) front the 80/443 publish above.
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
