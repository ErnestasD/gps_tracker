# Orbetra APP layer (staging, W7-D) — overlay on the infra compose:
#   docker compose -f docker-compose.yml -f docker-compose.apps.yml up -d
# One image, four services (tsx entrypoints — same as dev/e2e). Secrets come from
# /opt/orbetra/.env on the server (JWT_SECRET etc.) — NEVER from this file (rule 12).
# Internal services keep loopback-only publishing (PR #11: Docker bypasses UFW);
# only Caddy (80/443) and ingest TCP (5027 — devices must reach it) face the world.

services:
  # the staging HTTP-by-IP Caddyfile block reads {$ORBETRA_STAGING_HOST} from the
  # CONTAINER env — compose .env substitution alone doesn't reach the Caddyfile
  caddy:
    environment:
      ORBETRA_STAGING_HOST: ${ORBETRA_STAGING_HOST:-staging-host.invalid}
      ORBETRA_SITE_HOST: ${ORBETRA_SITE_HOST:-site-host.invalid}
      ORBETRA_SITE_WWW: ${ORBETRA_SITE_WWW:-www-host.invalid}
      ORBETRA_APP_HOST: ${ORBETRA_APP_HOST:-app-host.invalid}

  app-base:
    build:
      context: ../..
      dockerfile: infra/docker/app.Dockerfile
    image: orbetra-app:latest
    profiles: ["build-only"] # never runs — exists so `compose build app-base` builds the shared image

  ingest:
    image: orbetra-app:latest
    command: ["tsx", "apps/ingest/src/main.ts"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      INGEST_TCP_PORT: "5027"
      # UDP channel shares the port (a device picks ONE protocol); set INGEST_UDP_PORT=0 to disable
      PROMETHEUS_PORT: "9101"
    ports:
      - "5027:5027" # devices connect here (TCP) — the ONE public app port besides Caddy
      - "5027:5027/udp" # same port, UDP channel (Teltonika UDP-configured devices)
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: orbetra-app:latest
    command: ["tsx", "apps/worker/src/main.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${PG_PASSWORD:?PG_PASSWORD must be set in /opt/orbetra/.env}@pg:5432/orbetra
      REDIS_URL: redis://redis:6379
      PROMETHEUS_PORT: "9102"
      EXPORT_DIR: /var/orbetra/exports
      WEBHOOK_DELIVERY_RETENTION_DAYS: ${WEBHOOK_DELIVERY_RETENTION_DAYS:-30}
      # DERIVED location data (audit MED #53): events are deleted and trip coordinates nulled at the
      # same 13-month horizon the positions hypertable policy and the published privacy text use.
      # This one DESTROYS customer history — the code floors it at 30 days and logs the window it is
      # running with at boot, so a wrong value here is loud rather than silent.
      LOCATION_RETENTION_DAYS: ${LOCATION_RETENTION_DAYS:-396}
      TOKEN_RETENTION_DAYS: ${TOKEN_RETENTION_DAYS:-30}
      BILLING_EVENT_RETENTION_DAYS: ${BILLING_EVENT_RETENTION_DAYS:-90}
      RAW_REJECT_RETENTION_DAYS: ${RAW_REJECT_RETENTION_DAYS:-90}
      # pg pool (audit MED #30). ONE pool here serves 16 shard consumers plus a dozen BullMQ workers,
      # so the shared default of 10 queued acquires invisibly. Left EMPTY these fall back to the
      # code's defaults (24 / 10 s / 120 s) — `${VAR:-}` yields an empty string, which the parser
      # treats as absent precisely because this file's idiom produces it.
      PG_POOL_MAX: ${PG_POOL_MAX:-}
      PG_ACQUIRE_TIMEOUT_MS: ${PG_ACQUIRE_TIMEOUT_MS:-}
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # E05-5 email delivery (ADR-023) — values live in /opt/orbetra/.env (rule 12); absent ⇒ skipped
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SES_CONFIG_SET: ${SES_CONFIG_SET:-}
      # The worker needs this too, not just the api: the billing lapse ladder builds the "renew" link
      # from it, and without it the sweep refuses to suspend anyone (COUNT-ONLY at boot). It is the
      # one variable whose absence turns enforcement off silently, so it is passed explicitly here
      # rather than inherited by luck.
      APP_BASE_URL: ${APP_BASE_URL:-}
      SITE_BASE_URL: ${SITE_BASE_URL:-}
      # OUR logo on mail that is not white-labelled (apps/site serves /email-logo.png). Absent ⇒ the
      # header stays the product name as text — a broken image is worse than none on the line that
      # says who sent this. Enumerated here because nothing in this file is inherited by luck.
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-}
      # SMS gateway (ADR-032) — Twilio, values in /opt/orbetra/.env (rule 12); any of the three
      # absent ⇒ SMS channel disabled: the worker holds no driver, the send route 503s, the button hides
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      # …and the Messaging Service that carries Smart Encoding. Twilio TRIMS the leading space that
      # is the Teltonika SMS password prefix; Smart Encoding restores it from the Unicode space the
      # driver substitutes, and it runs for a Messaging Service only. Absent ⇒ device commands are
      # REFUSED rather than sent as a silent no-op (see twilioSafeBody). Plain SMS still work.
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      # the API-key auth pair, the alternative to the Auth Token that Twilio recommends because it
      # is revocable. `smsDriverFromEnv` has always read it; this file never passed it, so switching
      # to it would have turned the gateway off with no message anywhere. Found by the meta-test.
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      # Web Push (ADR-026) — VAPID_PRIVATE_KEY in /opt/orbetra/.env (rule 12); absent ⇒ webpush skipped
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@orbetra.com}
      # Stripe overage usage reporter (ADR-024 PR B2) — values in /opt/orbetra/.env (rule 12); absent ⇒ skipped
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_INCLUDED: ${STRIPE_INCLUDED:-}
      STRIPE_METER_EVENT: ${STRIPE_METER_EVENT:-orbetra_device_overage}
    volumes:
      - exports:/var/orbetra/exports
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    image: orbetra-app:latest
    command: ["tsx", "apps/api/src/main.ts"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${PG_PASSWORD:?PG_PASSWORD must be set in /opt/orbetra/.env}@pg:5432/orbetra
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: "3010"
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://185.80.129.33}
      # Reverse geocoding (CLAUDE.md rule 13, self-hosted Photon). The photon service + index are
      # provisioned and smoke-tested, but NO api code reads GEOCODER_URL yet — the consumer (address
      # lookup for positions/reports) is a planned follow-up. Kept wired so it's live the day it lands.
      GEOCODER_URL: http://photon:2322
      # pg pool — the API's own pool serves every raw-SQL history/report read (audit MED #30)
      PG_POOL_MAX: ${PG_POOL_MAX:-}
      PG_ACQUIRE_TIMEOUT_MS: ${PG_ACQUIRE_TIMEOUT_MS:-}
      PG_STATEMENT_TIMEOUT_MS: ${PG_STATEMENT_TIMEOUT_MS:-}
      # Per-tenant device-creation ceiling. Listed here so the runbook's "raise it in
      # /opt/orbetra/.env and restart the api" is actually true — `--env-file` only feeds compose
      # interpolation, so a variable absent from this map never reaches the process. Real defaults
      # rather than `:-`, because the empty string an unset `:-` passes is `Number('') === 0`.
      DEVICE_CREATE_MAX_PER_WINDOW: ${DEVICE_CREATE_MAX_PER_WINDOW:-10000}
      DEVICE_CREATE_WINDOW_S: ${DEVICE_CREATE_WINDOW_S:-3600}
      TRUST_PROXY: "1"
      # staging is reachable over plain HTTP by IP until DNS lands — Secure cookies
      # would silently break login there. Flip to 1 the day TLS is on.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      EXPORT_DIR: /var/orbetra/exports
      # Stripe billing (ADR-024) — values in /opt/orbetra/.env (rule 12); absent ⇒ billing routes 503
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICES: ${STRIPE_PRICES:-}
      STRIPE_OVERAGE_MAP: ${STRIPE_OVERAGE_MAP:-}
      # The price → plan map. Missing from this list until now, and the omission was NOT cosmetic:
      # `planFor` (billing/stripe.ts) then returns undefined for every price, so a paid subscription
      # never writes the tenant's plan and the customer keeps the trial's entitlements — no API
      # access, no SMS gateway, no white-label — while being billed in full. Silent in both
      # directions: Stripe is happy, the webhook succeeds, only the feature flags are wrong.
      STRIPE_PLAN_MAP: ${STRIPE_PLAN_MAP:-}
      # VAT switch. Off until MB Dokigo is VAT-registered; see docs/runbooks/stripe-catalog.md.
      # Listed here deliberately: an env var absent from THIS map never reaches the api process,
      # which is how STRIPE_PLAN_MAP was silently unset for weeks (PR #202).
      STRIPE_TAX_ENABLED: ${STRIPE_TAX_ENABLED:-}
      # The ONE SNS topic POST /v1/webhooks/ses accepts feedback from. A valid AWS signature only
      # proves AWS sent the message — the same regional certificate signs every customer's topics —
      # so the endpoint refuses anything from another topic, and FAILS CLOSED when this is unset.
      # It must be listed here or it never reaches the process (`--env-file` only feeds compose
      # interpolation), and the bounce feed would refuse even the subscription handshake for ever.
      SES_SNS_TOPIC_ARN: ${SES_SNS_TOPIC_ARN:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SITE_BASE_URL: ${SITE_BASE_URL:-}
      # Where a partner's payout request is mailed. Absent ⇒ the request is still RECORDED but
      # nobody is told, so a partner waits on money no human has been asked to send.
      PARTNER_OPS_EMAIL: ${PARTNER_OPS_EMAIL:-}
      # White-label hosting. PLATFORM_DOMAIN turns on the zero-setup `<slug>.<domain>` option (it
      # needs a `*.<domain>` A record to exist); EDGE_HOSTNAME is what a tenant CNAMEs their OWN
      # domain to. Both absent ⇒ the corresponding half of the setup instructions is simply not
      # offered — silent by design, which is exactly why they must be listed here.
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-}
      EDGE_HOSTNAME: ${EDGE_HOSTNAME:-}
      # The hostname trackers are told to dial, shown in the onboarding sheet and pasted into the
      # config SMS. Absent from this file until now, so the API served its hard-coded default — our
      # own domain — to resellers configuring their customers' hardware.
      INGEST_PUBLIC_HOST: ${INGEST_PUBLIC_HOST:-}
      # SMS gateway (ADR-032) — the API does NOT send SMS (the worker does); it needs these three only
      # to compute the `smsConfigured` boolean that gates the 503 / `smsEnabled` flag. Passing the token
      # here too (not just a presence flag) is the V1 shortcut; a future refactor could hand the API a bare
      # presence signal and keep TWILIO_AUTH_TOKEN in the worker alone (rule 12). Any absent ⇒ send route 503s.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      # …and the Messaging Service, which `smsConfigured` now requires: without Smart Encoding a
      # device command loses its password prefix and does nothing, so the button must not appear.
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      # the API-key auth pair, the alternative to the Auth Token that Twilio recommends because it
      # is revocable. `smsDriverFromEnv` has always read it; this file never passed it, so switching
      # to it would have turned the gateway off with no message anywhere. Found by the meta-test.
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      # Web Push (ADR-026) — the API serves the PUBLIC key to the browser; absent ⇒ push unavailable
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      # The platform console's infrastructure panel reads firing alerts from here. Listed because a
      # variable absent from this map never reaches the process — the same omission that left
      # STRIPE_PLAN_MAP and SES_SNS_TOPIC_ARN silently unset. Absent ⇒ the panel says "not
      # configured" instead of erroring, so a deploy without Prometheus stays a supported shape.
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-}
      # OSRM route optimization (ADR-029) — empty until staging preps the osrm volume
      # (infra/osrm/README.md), then set OSRM_URL=http://osrm:5000 in /opt/orbetra/.env;
      # absent ⇒ POST /v1/routing/optimize answers 503 and the web page degrades
      # Route optimization (ADR-034). Mapbox is the default engine — worldwide, no dataset.
      # SECRET: the value lives in /opt/orbetra/.env, never in git. It must be a token WITHOUT URL
      # restrictions — a server-side call sends no Referer, so a URL-restricted token 403s.
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      OSRM_URL: ${OSRM_URL:-}
    volumes:
      # the GDPR download route streams the file the WORKER wrote — same volume on both
      # (review HIGH: without this every export download 410s "file removed")
      - exports:/var/orbetra/exports
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    volumes:
      - ../prometheus/prometheus.staging.yml:/etc/prometheus/prometheus.yml:ro

  site:
    image: orbetra-app:latest
    # public marketing site (W9-S1): pre-built static dist behind Caddy
    command: ["pnpm", "--filter", "@orbetra/site", "exec", "vite", "preview", "--host", "0.0.0.0", "--port", "4174"]
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:3010
    depends_on:
      - api

  web:
    image: orbetra-app:latest
    # serves the PRE-BUILT dist (vite preview — the e2e-tested path); /v1+/ws go through
    # Caddy, so the SPA never needs an absolute API origin.
    # Mapbox (ADR-030): VITE_MAPBOX_TOKEN is baked into the dist at IMAGE BUILD time from
    # apps/web/.env (public pk. token; UNTRACKED in git — GitHub push protection blocks
    # Mapbox tokens — the deploy rsync carries it to this server). Runtime env cannot
    # change it; to rotate, update apps/web/.env and rebuild `compose build app-base`.
    command: ["pnpm", "--filter", "@orbetra/web", "exec", "vite", "preview", "--host", "0.0.0.0", "--port", "5173"]
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:3010
    depends_on:
      - api

volumes:
  exports:
