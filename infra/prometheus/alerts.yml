# Orbetra alert rules (W7-S1, PROJECT_PLAN §8). Metric names are the ones the apps
# actually emit (apps/{ingest,worker}/src/prom.ts) — verified, not guessed. Routed to
# the founders' Telegram via Alertmanager (infra/alertmanager/).
groups:
  - name: pipeline
    rules:
      # stream_depth = UNCONSUMED backlog (consumer-group lag + pending), not XLEN — XACK does not
      # delete entries and nothing trims raw:{shard}, so XLEN measures retention and never falls.
      # 50k = ingest's own pauseAboveDepth threshold; 90k approaches the 100k MAXLEN, where
      # never-processed entries start being EVICTED (silent I1 loss).
      - alert: StreamDepthHigh
        expr: max(stream_depth) > 50000
        for: 5m
        labels: { severity: warning, component: stream_depth }
        annotations:
          summary: "Redis stream depth high ({{ $value | humanize }})"
          description: "A shard backlog has exceeded 50k for 5m — consumers are falling behind. Check worker health / lease ownership."
      - alert: StreamDepthCritical
        expr: max(stream_depth) > 90000
        for: 2m
        labels: { severity: critical, component: stream_depth }
        annotations:
          summary: "Redis stream depth CRITICAL ({{ $value | humanize }})"
          description: "A shard's unconsumed backlog is near the 100k MAXLEN cap — unprocessed entries will be evicted (data loss). Scale or restart workers now."

      # pipeline_lag_ms: now − max(server_time), i.e. how long ingest→worker actually took. >30s
      # risks the trip & GDPR-erase guards (both assume lag << their windows).
      #
      # It used to be computed from FIX time, so these two alerts fired on device clock skew and on
      # buffered flushes: a truck returning from a weekend in a garage paged a critical while the
      # pipeline was idle, and a device with a fast RTC pinned the gauge at 0 and hid real lag.
      # `device_data_age_ms` carries that view now — worth watching, never worth paging on.
      - alert: PipelineLagHigh
        expr: max(pipeline_lag_ms) > 30000
        for: 5m
        labels: { severity: warning, component: pipeline_lag }
        annotations:
          summary: "Pipeline lag > 30s ({{ $value | humanize }}ms)"
          description: "Oldest unprocessed record is >30s old for 5m. Trip/geofence/GDPR guards assume lag << their windows."
      - alert: PipelineLagCritical
        expr: max(pipeline_lag_ms) > 120000
        for: 2m
        labels: { severity: critical, component: pipeline_lag }
        annotations:
          summary: "Pipeline lag CRITICAL ({{ $value | humanize }}ms)"
          description: "Lag >2m — do NOT run GDPR erase (60m guard assumes lag << 60m). Investigate the worker."

      # sudden CRC/structure failures = protocol drift or a misbehaving device fleet.
      - alert: ParseFailSpike
        expr: rate(ingest_parse_fail_total[5m]) > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Ingest parse-fail spike ({{ $value | humanize }}/s)"
          description: "CRC/structure failures >5/s for 10m — protocol drift or corrupt-frame flood. Check a capture."

      # p99 ACK latency SLA (§5: p99 < 250 ms).
      - alert: AckLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(ack_latency_ms_bucket[5m])) by (le)) > 250
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "ACK p99 latency > 250ms"
          description: "Ingest p99 ACK latency breached the §5 SLA (250ms) for 5m."

      # frames we verified but cannot DECODE (codec 16 today). Parked in raw:unsupported and ACKed
      # so the device advances, but the records are NOT in the pipeline — real hardware sending data
      # we shelve is a product gap, not a blip, and it is invisible without this rule.
      - alert: UnsupportedCodecSeen
        expr: rate(ingest_unsupported_codec_total[15m]) > 0
        for: 15m
        labels: { severity: warning, component: codec }
        annotations:
          summary: "Undecodable frames arriving ({{ $value | humanize }}/s)"
          description: "A device is sending a codec we park instead of decode (codec 16). Inspect raw:unsupported and identify the model/firmware."

      # a row Postgres refuses is quarantined so the batch survives — but the record is LOST to the
      # customer, so any sustained rate is a real defect (firmware quirk, spoofing, or a schema gap).
      - alert: DeadLetteredRows
        expr: rate(pipeline_dead_lettered_total[15m]) > 0
        for: 15m
        labels: { severity: warning, component: pipeline }
        annotations:
          summary: "Records quarantined to raw:dead ({{ $value | humanize }}/s, reason={{ $labels.reason }})"
          description: "Positions are being dropped from the pipeline. Inspect raw:dead payloads — rejected_by_db means a value no column accepts."

      # the platform-wide SMS breaker refuses config SMS for EVERY tenant until the window rolls,
      # so it must page rather than sit in a log line. device/tenant rejections are informational.
      - alert: SmsQuotaTripped
        expr: increase(sms_quota_rejected_total{scope="global"}[1h]) > 0
        for: 5m
        labels: { severity: critical, component: sms }
        annotations:
          summary: "Platform-wide SMS breaker tripped"
          description: "Config-SMS onboarding is refused for ALL tenants. Investigate the source, then `DEL sms:q:global` in Redis to reset — see the runbook."

      # a position field that did not fit its column, or a device clock running ahead of ours. Both
      # mean the row is kept but does NOT drive live state / trips / geofences — customer-visible
      # wrongness with no other signal (the audit's recurring "counter nobody alerts on" pattern).
      - alert: PositionsDegraded
        expr: rate(positions_field_nulled_total[15m]) > 0 or rate(positions_clock_skewed_total[15m]) > 0
        for: 15m
        labels: { severity: warning, component: pipeline }
        annotations:
          summary: "Positions arriving degraded ({{ $value | humanize }}/s)"
          description: "Fields are being nulled or records excluded from live state (device clock ahead of server). Identify the device/firmware — the live map and offline alerts for it are not trustworthy."

      # a signature-verified Stripe subscription webhook that matched NO TENANT. Stripe is acked
      # either way (a retry cannot conjure a missing customer mapping), so without this a paying
      # customer sits unprovisioned indefinitely and the first signal is their support ticket.
      # ONLY reason="no_tenant" — a `stale` outcome is normal (the monotonic and per-subscription
      # guards drop replayed / out-of-order / same-second deliveries by design), and paging on it
      # made this alert fire on routine Stripe traffic.
      - alert: BillingWebhookUnmatched
        expr: increase(billing_webhook_unmatched_total{reason="no_tenant"}[1h]) > 0
        for: 5m
        labels: { severity: critical, component: billing }
        annotations:
          summary: "Stripe webhook provisioned nothing ({{ $labels.reason }})"
          description: "A paying customer may have no plan. Find the customer id in the api log and reconcile `tenants.stripeCustomerId` by hand."

      # I4 backpressure sustained = a shard can't drain.
      - alert: BackpressureSustained
        expr: max(ingest_paused_sockets) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Sockets paused by backpressure for 10m"
          description: "ingest_paused_sockets > 0 sustained — a shard is not draining. Check worker throughput."

      # EVERY worker failure counter, in one rule. The counters existed and several comments
      # explicitly said "non-zero rate ⇒ alert" — but grep over alerts.yml found not a single
      # reference to any of them, so a job throwing on every run was indistinguishable from a quiet
      # system. Split by `job` so the notification names what broke. Audit MED.
      - alert: WorkerJobFailing
        expr: increase(worker_job_failed_total[1h]) > 0
        for: 10m
        labels: { severity: critical, component: worker }
        annotations:
          summary: "Worker job failing: {{ $labels.job }}"
          description: "A background job has thrown in the last hour. `stripe_usage` is silent under-billing (no backfill exists); `retention` means data is growing past policy; `auth_email:*` means a transactional message — an activation link, a password reset, the final warning before a fleet is cut off — is not being delivered, and the recipient has no way to know."

      - alert: UsageSweepFailing
        expr: increase(usage_sweep_failed_total[1h]) > 0
        for: 10m
        labels: { severity: critical, component: billing }
        annotations:
          summary: "Usage sweep failing — device-days are not being recorded"
          description: "usage_daily is the ONLY source for overage billing. The overage REPORTER now re-walks a trailing window, but nothing can re-create device-days that were never swept."

      # A TSP base price with no STRIPE_INCLUDED entry bills ZERO overage for every tenant on that
      # plan, silently and forever: the reporter cannot invent an allowance, and the skip used to be
      # indistinguishable from a Direct plan legitimately having none. Adding a price in Stripe and
      # forgetting the env entry is a two-minute mistake with an unbounded bill attached. Audit #23.
      - alert: StripeUnmappedPrice
        expr: stripe_unmapped_price_tenants > 0
        for: 10m
        labels: { severity: critical, component: billing }
        annotations:
          summary: "{{ $value }} TSP tenant(s) have a base price missing from STRIPE_INCLUDED"
          description: "Their overage is billing ZERO. The worker log names the price id and tenant — add `<priceId>:<includedDevices>` to STRIPE_INCLUDED and restart the worker. Past days self-correct: the reporter's trailing window re-submits the delta."

      # A customer's fleet was CUT OFF. Expected and deliberate — it is the end of the lapse ladder —
      # but it is the only automated action in the product that takes a live map away from someone,
      # so it is never silent: every suspension gets a line here and in the worker log. If this fires
      # for a tenant you did not expect, the ladder ran on bad billing state, not on a real lapse.
      - alert: BillingTenantSuspended
        expr: increase(billing_lapse_action_total{action="suspended"}[1h]) > 0
        for: 5m
        labels: { severity: warning, component: billing }
        annotations:
          summary: "{{ $value }} tenant(s) suspended for non-payment"
          description: "Their devices were removed from the ingest registry after the full warning ladder. The worker log names each one. A payment restores service within one webhook; `billing_lapse_action_total{action=\"restored\"}` tracks that."

      # Tenants whose entitlements are floored but who are still being ingested and served. The floor
      # is enforced only at device CREATE, so a canceled subscription or an expired trial takes away
      # nothing the customer can perceive — the fleet keeps tracking, at our storage cost, for free.
      # This is a business signal, not an outage: warning, and a long `for` so it is a standing list
      # rather than a page. Audit #22.
      - alert: BillingLapsedTenantsServed
        expr: billing_lapsed_actionable > 0
        for: 6h
        labels: { severity: warning, component: billing }
        annotations:
          summary: "{{ $value }} lapsed tenant(s) still being served past the grace window"
          description: "billing_lapsed_devices shows the devices still ingesting for free. The worker log lists each tenant with its name, reason and device count — decide per tenant: win them back, or retire the devices."

      - alert: EnginePersistErrors
        expr: increase(engine_persist_errors_total[15m]) > 0
        for: 10m
        labels: { severity: warning, component: worker }
        annotations:
          summary: "Geofence/rule transitions failing to persist ({{ $labels.engine }})"
          description: "In-memory engine state is rolled back so the crossing re-fires next batch — but a sustained rate means alerts are being delayed or lost. Check the DB."

      - alert: NotificationsFailing
        expr: rate(notification_failed_total[15m]) > 0.1
        for: 15m
        labels: { severity: warning, component: notify }
        annotations:
          summary: "Notifications failing ({{ $labels.channel }}, {{ $value | humanize }}/s)"
          description: "Alerts are not reaching customers. BullMQ retries, but a sustained rate means the channel is down (SMTP creds, Telegram token, VAPID keys)."

      - alert: WebhooksFailing
        expr: rate(webhook_failed_total[15m]) > 0.1
        for: 15m
        labels: { severity: warning, component: webhooks }
        annotations:
          summary: "Webhook deliveries failing ({{ $value | humanize }}/s)"
          description: "A tenant's integration is not receiving events. Check webhook_deliveries for the failing URL."

      - alert: TripPersistErrors
        expr: increase(trip_persist_errors_total[1h]) > 0
        for: 15m
        labels: { severity: warning, component: worker }
        annotations:
          summary: "Trip open/close writes failing"
          description: "Streaming trip persistence is advisory (recompute reconciles), but a non-zero rate means trips are being dropped from the live path."

      - alert: GdprJobFailing
        expr: increase(gdpr_failed_total[1h]) > 0
        for: 10m
        labels: { severity: critical, component: gdpr }
        annotations:
          summary: "GDPR job failing ({{ $labels.job }})"
          description: "An erase or export request is not completing. These carry a legal deadline — investigate immediately."

  - name: backups
    rules:
      # archive_mode=on (W7-S2): if archive-push fails, WAL piles up in pg_wal → disk fills
      # → PG stops accepting writes. Watch the archiver's failure counter directly, not just
      # the whole-disk alert (which fires late and never names the cause).
      - alert: WalArchiveFailing
        expr: rate(pg_stat_archiver_failed_count[5m]) > 0
        for: 15m
        labels: { severity: critical, component: backups }
        annotations:
          summary: "WAL archiving is FAILING"
          description: "pg_stat_archiver failed_count is rising — archive-push can't reach the repo. WAL will accumulate in pg_wal and eventually stop writes. First response: set archive_command to /bin/true to keep the DB up, then fix the repo (see w7-pgbackrest runbook)."
      # WAL backing up locally is the early symptom, independent of the whole root FS.
      - alert: WalDirGrowing
        expr: pg_stat_archiver_last_archived_time != 0 and (time() - pg_stat_archiver_last_archived_time) > 900
        for: 15m
        labels: { severity: warning, component: backups }
        annotations:
          summary: "No WAL archived in >15m"
          description: "The newest archived WAL segment is >15m old — archiving may be stuck. Check pgbackrest + repo reachability."

  - name: infra
    rules:
      # `up` for EVERY scraped job, not just the three apps. The disk and WAL rules read
      # node_exporter and postgres_exporter series — and a Prometheus rule whose series DISAPPEARS
      # simply stops evaluating, it does not fire. So an exporter crash-looping took the disk-full
      # and WAL-archive safety nets down with it, silently. Audit MED.
      - alert: ExporterDown
        expr: up{job=~"node|postgres|blackbox-tls|prometheus"} == 0
        for: 5m
        labels: { severity: critical, component: observability }
        annotations:
          summary: "Exporter down: {{ $labels.job }}"
          description: "Every rule built on this exporter's series has stopped evaluating — the safety nets it feeds (disk, WAL archive, TLS) are now blind, not quiet."

      # the customer-facing probe. CertExpiringSoon was deliberately guarded so it would NOT fire
      # during an outage (correct), which removed the last incidental outage signal — this is its
      # replacement.
      - alert: EndpointDown
        expr: probe_success == 0
        for: 3m
        labels: { severity: critical, component: availability }
        annotations:
          summary: "Endpoint unreachable: {{ $labels.instance }}"
          description: "The blackbox probe cannot reach a customer-facing endpoint. This is an outage, not a warning."

      # a process that answers EVERY request with a 500 keeps up == 1. Before the API exported
      # request metrics there was no rule that could tell the difference.
      - alert: ApiErrorRate
        expr: |
          sum(rate(http_requests_total{status="5xx"}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: critical, component: api }
        annotations:
          summary: "API 5xx rate above 5% ({{ $value | humanizePercentage }})"
          description: "The process is alive and failing. Check the api log for `unhandled API error` and the pg pool."

      - alert: ApiLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route)) > 2
        for: 10m
        labels: { severity: warning, component: api }
        annotations:
          summary: "API p95 latency > 2s on {{ $labels.route }}"
          description: "Usually pg pool saturation (max 10, no acquire timeout) or an unbounded report query."

      - alert: TargetDown
        expr: up{job=~"ingest|worker|api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is DOWN"
          description: "Prometheus can't scrape {{ $labels.job }} for 2m — the service is down or unreachable."

      - alert: DiskFillingUp
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels: { severity: warning, component: disk }
        annotations:
          summary: "Disk < 15% free ({{ $value | humanizePercentage }})"
          description: "Root filesystem below 15% — the positions hypertable grows continuously. Plan retention / capacity."
      - alert: DiskCritical
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.05
        for: 5m
        labels: { severity: critical, component: disk }
        annotations:
          summary: "Disk < 5% free ({{ $value | humanizePercentage }})"
          description: "Root filesystem critically low — writes will start failing. Act now."

      # Caddy auto-renews; this is the safety net if renewal silently fails.
      - alert: CertExpiringSoon
        # probe_ssl_earliest_cert_expiry is 0 when TLS can't be established — guard against
        # 0-time() firing a false 'cert expiring' during an outage (review HIGH)
        expr: (probe_ssl_earliest_cert_expiry > 0) and (probe_ssl_earliest_cert_expiry - time() < 14 * 24 * 3600)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "TLS cert for {{ $labels.instance }} expires in <14d"
          description: "Caddy should auto-renew; if this fires, renewal failed. Check the caddy container logs."
