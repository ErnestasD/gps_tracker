<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      NO <title> and no description/og tags here, deliberately.

      The router owns the head (`HeadContent` in __root, plus a `head` on every route), and the
      browser takes the FIRST <title> in the document. A static one here therefore won this race on
      every page: /docs, /pricing, /compatibility and every knowledge-base article all shipped the
      home page's title and description, to every crawler and every shared link. The root route
      declares exactly the same defaults, so nothing is lost — a route without its own title still
      gets the home page's.
    -->
    <meta name="theme-color" content="#04070F" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
