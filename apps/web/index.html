<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- neutral near-black; the per-host manifest carries the tenant's own theme colour -->
    <meta name="theme-color" content="#0A0E1A" />
    <!-- Deliberately no <title> and no icon links: this file is byte-identical on every host, so
         anything named in it is named to every tenant's customers — including in view-source. Both
         are set at runtime from the branding the host resolves to; see applyBranding and
         faviconLinks in src/lib/branding.ts, and the manifest route in apps/api. -->
    <link rel="manifest" href="/v1/public/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
